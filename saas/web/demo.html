<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Celeris Demo App</title>
    <link rel="stylesheet" href="/demo/styles.css" />
  </head>
  <body>
    <main class="demo-shell">
      <header class="hero">
        <div>
          <h1>Celeris Demo App</h1>
          <p>Sign in, buy credits, mint an item, and watch balance plus result update live.</p>
        </div>
      </header>

      <section class="layout">
        <section class="panel controls">
          <div class="field">
            <label for="email-input">Email</label>
            <div class="row">
              <input id="email-input" type="email" value="demo-player@example.com" />
              <button id="sign-in-btn">Sign In</button>
            </div>
          </div>

          <div class="field">
            <label for="app-select">App</label>
            <select id="app-select"></select>
          </div>

          <div class="actions">
            <button id="buy-credits-btn" disabled>Buy Credits</button>
            <button id="mint-item-btn" disabled>Mint Item</button>
          </div>

          <div class="status-grid">
            <div class="status-card">
              <span class="status-label">Balance</span>
              <strong id="balance-value">0</strong>
            </div>
            <div class="status-card">
              <span class="status-label">Reserved</span>
              <strong id="reserved-value">0</strong>
            </div>
          </div>
        </section>

        <section class="panel result-panel">
          <h2>Result</h2>
          <pre id="result-output">Ready.</pre>
        </section>
      </section>
    </main>

    <script type="module" src="/demo/app.js"></script>
  </body>
  </html>
